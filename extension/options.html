<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atempause Einstellungen</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<main class="page">
  <h1>Atempause</h1>
  <p class="muted">Bei diesen Websites atmest du erst einmal durch.</p>

  <section class="card">
    <label for="sites">Websites, eine pro Zeile</label>
    <textarea id="sites" rows="9" spellcheck="false"></textarea>
    <p class="muted small">Subdomains sind mit drin: instagram.com deckt auch www.instagram.com ab.</p>

    <div class="row">
      <label for="grace">Frei nach „Weiter“ (Minuten)</label>
      <input id="grace" type="number" min="1" max="240">
    </div>
    <div class="row">
      <label for="breaths">Atemzüge</label>
      <input id="breaths" type="number" min="1" max="5">
    </div>
    <button id="save">Speichern</button>
    <span id="saved" class="muted small"></span>
  </section>

  <section class="card">
    <h2>Letzte 7 Tage</h2>
    <table id="stats"></table>
  </section>
</main>
<script src="stats.js"></script>
<script src="options.js"></script>
</body>
</html>

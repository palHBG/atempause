<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<title>Atempause</title>
<link rel="stylesheet" href="breathe.css">
</head>
<body>
<main id="app">
  <section id="breath" class="screen active" aria-live="polite">
    <div class="orb-wrap">
      <div class="halo"></div>
      <div class="orb" id="orb"></div>
    </div>
    <p class="prompt" id="prompt">Einen Moment</p>
  </section>

  <section id="choice" class="screen">
    <div class="orb-wrap small"><div class="orb rest"></div></div>
    <h1 id="headline"></h1>
    <p class="sub" id="subline"></p>
    <div class="actions">
      <button class="primary" id="btn-back">Ich will doch nicht</button>
      <button class="ghost" id="btn-go"></button>
    </div>
    <p class="hint" id="hint"></p>
  </section>

  <section id="done" class="screen">
    <div class="orb-wrap small"><div class="orb rest"></div></div>
    <h1>Gut gemacht.</h1>
    <p class="sub" id="done-sub"></p>
  </section>
</main>
<script src="breathe.js"></script>
</body>
</html>
